<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>智能体科技</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#14141f;--border:#1e1e2e;--text:#e0e0e8;--dim:#6b6b80;--blue:#3b82f6;--blue2:#2563eb;--green:#10b981;--red:#ef4444;--orange:#f59e0b}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--card)}
.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;gap:8px}
.header-btn{background:var(--border);color:var(--text);border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.header-btn:hover{background:var(--blue);color:#fff}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;min-width:260px;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s}
.sidebar-header{padding:12px 16px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sidebar-header .title{display:flex;align-items:center;gap:6px}
.new-chat-btn{background:var(--blue);color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s}
.new-chat-btn:hover{background:var(--blue2)}
.session-list{flex:1;overflow-y:auto;padding:8px}
.session-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .2s;font-size:13px;line-height:1.4;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.session-item:hover{background:var(--border)}
.session-item.active{background:var(--border);border:1px solid var(--blue)}
.session-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-del{color:var(--dim);cursor:pointer;font-size:14px;opacity:0;transition:opacity .2s;flex-shrink:0}
.session-item:hover .session-del{opacity:1}
.session-del:hover{color:var(--red)}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;animation:fadeIn .3s;white-space:pre-wrap;word-break:break-word}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.news{align-self:flex-start;background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid var(--border);border-bottom-left-radius:4px;white-space:pre-line;max-width:90%}
.typing{align-self:flex-start;color:var(--dim);font-size:13px;padding:8px 16px}
.typing span{display:inline-block;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.input-area{padding:16px 20px;border-top:1px solid var(--border);background:var(--card)}
.input-row{display:flex;gap:10px;align-items:center}
.input-row input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;outline:none;transition:border .2s}
.input-row input:focus{border-color:var(--blue)}
.send-btn{background:var(--blue);color:#fff;border:none;padding:12px 20px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s;white-space:nowrap}
.send-btn:hover{background:var(--blue2)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.model-bar{display:flex;gap:6px;padding:8px 20px;border-top:1px solid var(--border);background:var(--card);flex-wrap:wrap;align-items:center}
.model-label{font-size:12px;color:var(--dim);margin-right:4px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.online{background:var(--green)}
.model-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.model-modal.show{display:flex}
.model-modal-content{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}
.model-modal-content h3{margin-bottom:16px;font-size:16px}
.model-option{padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.model-option:hover{border-color:var(--blue)}
.model-option.selected{border-color:var(--blue);background:rgba(59,130,246,.1)}
.model-option .m-name{font-weight:600;font-size:14px}
.model-option .m-desc{color:var(--dim);font-size:12px;margin-top:4px}
.close-modal{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;float:right}
.sidebar-toggle{display:none;position:fixed;top:60px;left:8px;z-index:60;background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;align-items:center;justify-content:center}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:52px;bottom:0;z-index:50;width:280px;min-width:280px;transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:flex}
  .msg{max-width:92%}
}
</style>
</head>
<body>
<div class="header">
  <h1>⚡ 智能体科技</h1>
  <div class="header-actions">
    <button class="header-btn" onclick="loadNews()">📰 新闻</button>
    <button class="header-btn" onclick="showModelModal()">🧠 模型</button>
    <button class="header-btn" onclick="fastTest()">🚀 测速</button>
    <button class="header-btn" onclick="clearChat()">🗑 清空</button>
  </div>
</div>
<button class="sidebar-toggle" onclick="toggleSidebar()" title="历史记录">☰</button>
<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="title">💬 历史记录</span>
      <button class="new-chat-btn" onclick="newChat()">+ 新对话</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>
  <div class="chat-area">
    <div class="model-bar">
      <span class="model-label"><span class="status-dot online" id="statusDot"></span>当前模型:</span>
      <span id="currentModel" style="font-size:13px;color:var(--blue);font-weight:500">Llama 3.1 8B</span>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">👋 你好！我是智能体科技<br><br>💬 直接输入消息对话<br>📰 点击新闻按钮获取每日简报<br>🧠 切换AI模型 / 🚀 自动测速</div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()" autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="send()">发送</button>
      </div>
    </div>
  </div>
</div>
<div class="model-modal" id="modelModal" onclick="if(event.target===this)hideModelModal()">
  <div class="model-modal-content">
    <button class="close-modal" onclick="hideModelModal()">✕</button>
    <h3>🧠 选择 AI 模型</h3>
    <div id="modelOptions"></div>
  </div>
</div>
<script>
const MODELS=[
  {id:'meta/llama-3.1-8b-instruct',name:'Llama 3.1 8B',desc:'极速响应，日常对话',tag:'l8'},
  {id:'nvidia/nemotron-3-nano-30b-a3b',name:'Nemotron 3 Nano',desc:'NVIDIA 轻量版，响应极快',tag:'nemN'},
  {id:'openai/gpt-oss-20b',name:'GPT-OSS 20B',desc:'OpenAI 开源，推理快',tag:'gptoss'},
  {id:'google/gemma-4-31b-it',name:'Gemma 4 31B',desc:'Google 最新开源',tag:'gem4'},
  {id:'deepseek-ai/deepseek-v4-pro',name:'DeepSeek V4 Pro',desc:'1.6T MoE，推理最强',tag:'v4p'},
  {id:'stepfun-ai/step-3.7-flash',name:'Step 3.7 Flash',desc:'阶跃星辰，中文优化',tag:'step'},
  {id:'nvidia/nemotron-3-super-120b-a12b',name:'Nemotron 3 Super',desc:'NVIDIA 自研，1M 上下文',tag:'nemS'}
];

// ── 会话管理 ──
let currentTag='l8';
let chatHistory=[];
let currentSessionId=null;

function getSessions(){
  try{return JSON.parse(localStorage.getItem('ai_sessions'))||[];}catch{return [];}
}
function saveSessions(s){localStorage.setItem('ai_sessions',JSON.stringify(s));}
function getSessionData(id){
  try{return JSON.parse(localStorage.getItem('ai_data_'+id))||{history:[],model:'l8'};}catch{return {history:[],model:'l8'};}
}
function saveSessionData(id,data){localStorage.setItem('ai_data_'+id,JSON.stringify(data));}
function deleteSessionData(id){localStorage.removeItem('ai_data_'+id);}

function genId(){return 's_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}

function newChat(){
  const id=genId();
  const sessions=getSessions();
  sessions.unshift({id:id,title:'新对话',ts:Date.now()});
  saveSessions(sessions);
  switchSession(id);
  renderSessionList();
}

function switchSession(id){
  // 保存当前会话
  saveCurrentSession();
  currentSessionId=id;
  const data=getSessionData(id);
  chatHistory=data.history||[];
  currentTag=data.model||'l8';
  const m=MODELS.find(m=>m.tag===currentTag)||MODELS[0];
  document.getElementById('currentModel').textContent=m.name;
  renderMessages();
  renderSessionList();
  // 移动端收起侧边栏
  document.getElementById('sidebar').classList.remove('open');
}

function saveCurrentSession(){
  if(!currentSessionId)return;
  const data={history:chatHistory,model:currentTag};
  saveSessionData(currentSessionId,data);
  // 更新标题（取第一条用户消息前20字）
  const firstUser=chatHistory.find(m=>m.role==='user');
  let title='新对话';
  if(firstUser)title=firstUser.content.slice(0,20)+(firstUser.content.length>20?'...':'');
  const sessions=getSessions();
  const idx=sessions.findIndex(s=>s.id===currentSessionId);
  if(idx>=0){sessions[idx].title=title;sessions[idx].ts=Date.now();saveSessions(sessions);}
}

function deleteSession(id){
  let sessions=getSessions();
  sessions=sessions.filter(s=>s.id!==id);
  saveSessions(sessions);
  deleteSessionData(id);
  if(id===currentSessionId){
    if(sessions.length>0){switchSession(sessions[0].id);}
    else{newChat();}
  }
  renderSessionList();
}

function renderSessionList(){
  const list=document.getElementById('sessionList');
  const sessions=getSessions();
  list.innerHTML='';
  if(sessions.length===0){
    list.innerHTML='<div style="color:var(--dim);text-align:center;padding:40px 16px;font-size:13px">暂无历史记录</div>';
    return;
  }
  sessions.forEach(function(s){
    const item=document.createElement('div');
    item.className='session-item'+(s.id===currentSessionId?' active':'');
    const timeStr=new Date(s.ts).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    item.innerHTML='<span class="session-title" title="'+s.title+'">💬 '+s.title+'</span><span style="color:var(--dim);font-size:11px;flex-shrink:0">'+timeStr+'</span><span class="session-del" onclick="event.stopPropagation();deleteSession(\''+s.id+'\')" title="删除">✕</span>';
    item.onclick=function(){switchSession(s.id);};
    list.appendChild(item);
  });
}

function renderMessages(){
  const d=document.getElementById('messages');
  d.innerHTML='';
  if(chatHistory.length===0){
    d.innerHTML='<div class="msg bot">👋 你好！我是智能体科技<br><br>💬 直接输入消息对话<br>📰 点击新闻按钮获取每日简报<br>🧠 切换AI模型 / 🚀 自动测速</div>';
    return;
  }
  chatHistory.forEach(function(m){
    if(m.role==='user')addMsgNoSave(m.content,'user');
    else if(m.role==='assistant')addMsgNoSave(m.content,'bot');
  });
  d.scrollTop=d.scrollHeight;
}

function addMsgNoSave(text,cls){
  const d=document.getElementById('messages');
  const m=document.createElement('div');
  m.className='msg '+(cls||'bot');
  m.textContent=text;
  d.appendChild(m);
  d.scrollTop=d.scrollHeight;
}

function addMsg(text,cls){
  addMsgNoSave(text,cls);
}

// ── 核心 ──
function addTyping(){
  const d=document.getElementById('messages');
  const m=document.createElement('div');
  m.className='typing';m.id='typing';
  m.innerHTML='<span>●</span> <span>●</span> <span>●</span> AI思考中';
  d.appendChild(m);d.scrollTop=d.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove()}

async function api(path,body){
  try{
    const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    return await r.json();
  }catch(e){return{ok:false,error:e.message}}
}

async function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();if(!text)return;
  input.value='';addMsg(text,'user');
  chatHistory.push({role:'user',content:text});
  document.getElementById('sendBtn').disabled=true;
  addTyping();
  const res=await api('chat',{messages:chatHistory,model:currentTag,sid:currentSessionId});
  removeTyping();
  if(res.ok){
    addMsg(res.text);chatHistory.push({role:'assistant',content:res.text});
  }else{addMsg('❌ '+((res.error)||'请求失败'))}
  if(chatHistory.length>20)chatHistory=chatHistory.slice(-20);
  saveCurrentSession();
  renderSessionList();
  document.getElementById('sendBtn').disabled=false;
}

async function loadNews(){
  addMsg('📰 正在获取新闻...','bot');addTyping();
  const res=await api('news');
  removeTyping();
  if(res.ok)addMsg(res.text,'news');
  else addMsg('❌ 获取新闻失败');
}

function showModelModal(){
  const c=document.getElementById('modelOptions');c.innerHTML='';
  MODELS.forEach(function(m){
    const d=document.createElement('div');
    d.className='model-option'+(m.tag===currentTag?' selected':'');
    d.innerHTML='<div class="m-name">'+m.name+'</div><div class="m-desc">'+m.desc+'</div>';
    d.onclick=async function(){currentTag=m.tag;document.getElementById('currentModel').textContent=m.name;
      await api('model',{tag:m.tag,sid:currentSessionId});hideModelModal();
      c.querySelectorAll('.model-option').forEach(function(o){o.classList.remove('selected')});d.classList.add('selected');
      saveCurrentSession();
    };
    c.appendChild(d);
  });
  document.getElementById('modelModal').classList.add('show');
}
function hideModelModal(){document.getElementById('modelModal').classList.remove('show')}

async function fastTest(){
  addMsg('🚀 正在测速所有模型...','bot');addTyping();
  const res=await api('fast');
  removeTyping();
  if(res.ok)addMsg(res.text.replace(/\\n/g,'\n'),'news');
  else addMsg('❌ 测速失败');
}

function clearChat(){
  chatHistory=[];
  saveCurrentSession();
  document.getElementById('messages').innerHTML='<div class="msg bot">🗑 对话已清空</div>';
  renderSessionList();
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

// ── 初始化 ──
(function init(){
  const sessions=getSessions();
  if(sessions.length>0){
    switchSession(sessions[0].id);
  }else{
    newChat();
  }
  document.getElementById('input').focus();
})();
</script>
</body>
</html>
